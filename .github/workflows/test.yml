name: Verify execution forks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Install the actual package and execute SQLite branches
        shell: bash
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/installed-forkwake"
          cd "$RUNNER_TEMP/installed-forkwake"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/forkwake-0.4.1.tgz"
          ./node_modules/.bin/forkwake demo --out "$RUNNER_TEMP/sqlite-futures"
          node "$GITHUB_WORKSPACE/scripts/check-demo.mjs" "$RUNNER_TEMP/sqlite-futures/outcomes.json"
          ./node_modules/.bin/forkwake explore --input 4 --goal 1 --out "$RUNNER_TEMP/sqlite-search"
          node "$GITHUB_WORKSPACE/scripts/check-search.mjs" "$RUNNER_TEMP/sqlite-search/search.json"
          ./node_modules/.bin/forkwake explore --script ./node_modules/forkwake/examples/javascript/workflow.js --goal 1 --out "$RUNNER_TEMP/javascript-search"
          node "$GITHUB_WORKSPACE/scripts/check-javascript.mjs" "$RUNNER_TEMP/javascript-search/search.json"
          ./node_modules/.bin/forkwake capture --script ./node_modules/forkwake/examples/javascript/origin-example.js --origin --out "$RUNNER_TEMP/origin-cut"
          ./node_modules/.bin/forkwake continue --workspace "$RUNNER_TEMP/origin-cut/workspace.forkwake" --responses 1,-1,-1 --out "$RUNNER_TEMP/origin-dispatch"
          ./node_modules/.bin/forkwake continue --workspace "$RUNNER_TEMP/origin-dispatch/workspace.forkwake" --responses 1 --out "$RUNNER_TEMP/origin-ending"
          node "$GITHUB_WORKSPACE/scripts/check-origin.mjs" "$RUNNER_TEMP/origin-dispatch/outcomes.json" "$RUNNER_TEMP/origin-ending/outcomes.json"
          recipe="$PWD/node_modules/forkwake/examples/javascript/regression/timeout-regression.test.mjs"
          test -f "$recipe"
          test ! -e "$RUNNER_TEMP/timeout-faulty"
          test ! -e "$RUNNER_TEMP/timeout-corrected"
          red_status=0
          FORKWAKE_RECIPE_POLICY=faulty FORKWAKE_RECIPE_OUT="$RUNNER_TEMP/timeout-faulty" node --test "$recipe" || red_status=$?
          if [ "$red_status" -ne 1 ]; then
            echo "Expected the faulty business rule to fail with exit 1, got $red_status"
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.argv[1])); assert.equal(r.policy,"faulty"); assert.equal(r.invariant.passed,false); assert.deepEqual(r.replies,[1,-1,-1,1]); assert.equal(r.ledger.reserved,true); assert.equal(r.ledger.paid,false); assert.equal(r.ledger.dispatched,true);' "$RUNNER_TEMP/timeout-faulty/regression-receipt.json"
          FORKWAKE_RECIPE_OUT="$RUNNER_TEMP/timeout-corrected" node --test "$recipe"
