name: Verify execution forks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Install the actual package and execute SQLite branches
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/installed-forkwake"
          cd "$RUNNER_TEMP/installed-forkwake"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/forkwake-0.1.0.tgz"
          ./node_modules/.bin/forkwake demo --out "$RUNNER_TEMP/sqlite-futures"
          node "$GITHUB_WORKSPACE/scripts/check-demo.mjs" "$RUNNER_TEMP/sqlite-futures/outcomes.json"
