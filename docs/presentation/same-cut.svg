<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="fork-title fork-desc"><title id="fork-title">One cut. Two ledgers.</title><desc id="fork-desc">Actual synthetic transfer run. The same saved Confirm transfer cut produces total 120 after approval and total 95 after two timeouts. Import revalidates one earlier decision; the subsequent branches do not replay that prefix.</desc><rect width="1000" height="650" fill="#f6f8fc"/><text x="40" y="44" font-family="Arial, sans-serif" font-size="13" fill="#4d617e" font-weight="700">FORKWAKE / EXECUTION RECORD</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="43" fill="#202a3b" font-weight="700">One cut. Two ledgers.</text><text x="40" y="133" font-family="Arial, sans-serif" font-size="21" fill="#202a3b" font-weight="400">A deliberately faulty JavaScript transfer</text><rect x="40" y="165" width="920" height="125" rx="12" fill="#edf2ff" stroke="#2458da"/><text x="60" y="194" font-family="Arial, sans-serif" font-size="17" fill="#2458da" font-weight="700">SAVED CUT · Confirm transfer</text><text x="60" y="229" font-family="Arial, sans-serif" font-size="19" fill="#202a3b" font-weight="400">Sender 75 · reserved amount 25</text><text x="60" y="260" font-family="Arial, sans-serif" font-size="18" fill="#202a3b" font-weight="400">Closure reserved · 4 MiB guest memory</text><path d="M500 290 V305 H260 V330 M500 305 H740 V330" fill="none" stroke="#8a9bb3" stroke-width="2"/><rect x="40" y="330" width="440" height="230" rx="12" fill="#ffffff" stroke="#d3dbe8"/><text x="60" y="360" font-family="Arial, sans-serif" font-size="15" fill="#2458da" font-weight="700">APPROVAL</text><text x="60" y="395" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Confirm → 1 · Publish receipt → 1</text><text x="60" y="463" font-family="Arial, sans-serif" font-size="36" fill="#2458da" font-weight="700">75 + 45 = 120</text><text x="60" y="500" font-family="Arial, sans-serif" font-size="16" fill="#202a3b" font-weight="400">Sender + recipient · resultI32 = 0</text><text x="60" y="529" font-family="Arial, sans-serif" font-size="18" fill="#2458da" font-weight="700">conserved: true</text><rect x="520" y="330" width="440" height="230" rx="12" fill="#ffffff" stroke="#d3dbe8"/><text x="540" y="360" font-family="Arial, sans-serif" font-size="15" fill="#b23124" font-weight="700">TWO TIMEOUTS</text><text x="540" y="395" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Confirm → −1 · Retry → −1</text><text x="540" y="423" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Publish receipt → 1</text><text x="540" y="463" font-family="Arial, sans-serif" font-size="36" fill="#b23124" font-weight="700">75 + 20 = 95</text><text x="540" y="500" font-family="Arial, sans-serif" font-size="16" fill="#202a3b" font-weight="400">Sender + recipient · resultI32 = 1</text><text x="540" y="529" font-family="Arial, sans-serif" font-size="18" fill="#b23124" font-weight="700">conserved: false</text><text x="40" y="602" font-family="Arial, sans-serif" font-size="18" fill="#202a3b" font-weight="400">Import checks 1 earlier decision once. Each branch then resumes the verified cut.</text><text x="40" y="630" font-family="Arial, sans-serif" font-size="14" fill="#4d617e" font-weight="400">Actual CLI output · modeled values, not a real payment service · source and raw records linked below</text></svg>
