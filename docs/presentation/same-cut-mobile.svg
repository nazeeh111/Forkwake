<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1090" role="img" aria-labelledby="fork-title fork-desc"><title id="fork-title">One cut. Two ledgers.</title><desc id="fork-desc">Actual synthetic transfer run. The same saved Confirm transfer cut produces total 120 after approval and total 95 after two timeouts. Import revalidates one earlier decision; the subsequent branches do not replay that prefix.</desc><rect width="440" height="1090" fill="#f6f8fc"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="13" fill="#4d617e" font-weight="700">FORKWAKE / EXECUTION RECORD</text><text x="24" y="82" font-family="Arial, sans-serif" font-size="30" fill="#202a3b" font-weight="700">One cut. Two ledgers.</text><text x="24" y="116" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">A deliberately faulty JavaScript transfer</text><rect x="24" y="145" width="392" height="125" rx="12" fill="#edf2ff" stroke="#2458da"/><text x="44" y="174" font-family="Arial, sans-serif" font-size="17" fill="#2458da" font-weight="700">SAVED CUT · Confirm transfer</text><text x="44" y="209" font-family="Arial, sans-serif" font-size="19" fill="#202a3b" font-weight="400">Sender 75 · reserved amount 25</text><text x="44" y="240" font-family="Arial, sans-serif" font-size="18" fill="#202a3b" font-weight="400">Closure reserved · 4 MiB guest memory</text><path d="M220 270 V286 H12 V650 H24 M12 325 H24" fill="none" stroke="#8a9bb3" stroke-width="2"/><text x="24" y="617" font-family="Arial, sans-serif" font-size="14" fill="#4d617e" font-weight="400">Alternate branch from the same cut</text><rect x="24" y="310" width="392" height="283" rx="12" fill="#ffffff" stroke="#d3dbe8"/><text x="44" y="340" font-family="Arial, sans-serif" font-size="15" fill="#2458da" font-weight="700">APPROVAL</text><text x="44" y="375" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Confirm → 1</text><text x="44" y="403" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Publish receipt → 1</text><text x="44" y="453" font-family="Arial, sans-serif" font-size="36" fill="#2458da" font-weight="700">75 + 45 = 120</text><text x="44" y="490" font-family="Arial, sans-serif" font-size="16" fill="#202a3b" font-weight="400">Sender + recipient · resultI32 = 0</text><text x="44" y="519" font-family="Arial, sans-serif" font-size="18" fill="#2458da" font-weight="700">conserved: true</text><rect x="24" y="635" width="392" height="318" rx="12" fill="#ffffff" stroke="#d3dbe8"/><text x="44" y="665" font-family="Arial, sans-serif" font-size="15" fill="#b23124" font-weight="700">TWO TIMEOUTS</text><text x="44" y="700" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Confirm → −1</text><text x="44" y="728" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Retry → −1</text><text x="44" y="756" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Publish receipt → 1</text><text x="44" y="806" font-family="Arial, sans-serif" font-size="36" fill="#b23124" font-weight="700">75 + 20 = 95</text><text x="44" y="843" font-family="Arial, sans-serif" font-size="16" fill="#202a3b" font-weight="400">Sender + recipient · resultI32 = 1</text><text x="44" y="872" font-family="Arial, sans-serif" font-size="18" fill="#b23124" font-weight="700">conserved: false</text><text x="24" y="995" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Import checks 1 earlier decision once.</text><text x="24" y="1023" font-family="Arial, sans-serif" font-size="17" fill="#202a3b" font-weight="400">Each branch resumes that verified cut.</text><text x="24" y="1061" font-family="Arial, sans-serif" font-size="15" fill="#4d617e" font-weight="400">Modeled values, not a real payment service.</text></svg>
